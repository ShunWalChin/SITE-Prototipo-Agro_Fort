# Production reverse proxy. Keep headers at server scope so static assets and
# error responses receive the same browser protections as HTML pages.
server_tokens off;
limit_req_zone $binary_remote_addr zone=agrofort_leads:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name agrofort.64.181.178.125.nip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agrofort.64.181.178.125.nip.io;

    ssl_certificate /etc/letsencrypt/live/agrofort.64.181.178.125.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agrofort.64.181.178.125.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/agrofort.access.log;
    error_log /var/log/nginx/agrofort.error.log warn;
    client_max_body_size 1m;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.googletagmanager.com; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location = /api/ {
        default_type application/json;
        return 404 '{"error":"not_found"}';
    }

    location = /api/leads {
        client_max_body_size 20k;
        limit_req zone=agrofort_leads burst=5 nodelay;
        proxy_pass http://127.0.0.1:4188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 10s;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:4188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:4188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
